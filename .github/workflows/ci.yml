
name: CI - Backends

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  project-merito:
    name: Build - Project Merito
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_merito
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_merito"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/project_merito
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar build e testes
        working-directory: backend/project_merito
        run: |
          chmod +x gradlew
          ./gradlew build

  project-relatorios:
    name: Build - Project Relatorios
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: project_relatorios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d project_relatorios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/project_relatorios
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar build e testes
        working-directory: backend/project_relatorios
        run: |
          chmod +x gradlew
          ./gradlew build
