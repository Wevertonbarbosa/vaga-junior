
name: CI - Backends

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  project-merito:
    name: Build - Project Merito
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar build e testes
        working-directory: backend/project_merito
        run: |
          chmod +x gradlew
          ./gradlew build

  project-relatorios:
    name: Build - Project Relatorios
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Executar build e testes
        working-directory: backend/project_relatorios
        run: |
          chmod +x gradlew
          ./gradlew build
