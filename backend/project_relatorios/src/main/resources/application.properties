spring.application.name=project_relatorios

# Porta HTTP do Backend B
server.port=8081

# PostgreSQL exclusivo do Backend B
spring.datasource.url=jdbc:postgresql://localhost:5432/project_relatorios
spring.datasource.username=postgres
spring.datasource.password=wevertonlima00

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=relatorios-consumidores
spring.kafka.consumer.auto-offset-reset=earliest

# Desserialização da chave
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Desserialização do valor com tratamento de erros
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Define o desserializador JSON utilizado internamente
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Classe que representa o evento no Backend B
spring.kafka.consumer.properties.spring.json.value.default.type=br.com.merito.project_relatorios.dto.event.AbastecimentoCriadoEvent

# Pacote autorizado do próprio Backend B
spring.kafka.consumer.properties.spring.json.trusted.packages=br.com.merito.project_relatorios.dto.event

# Ignora o nome da classe enviado no cabeçalho pelo Backend A
spring.kafka.consumer.properties.spring.json.use.type.headers=false
